# golangci-lint settings for the redactor (the Bluebox monorepo settings, minus monorepo-only rules).
version: "2"
linters:
  settings:
    staticcheck:
      checks:
        - all
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
formatters:
  enable:
    - gofmt
