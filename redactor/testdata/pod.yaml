apiVersion: v1
kind: Pod
metadata:
  annotations:
    kubectl.kubernetes.io/last-applied-configuration: |
      {"apiVersion":"v1","kind":"Pod","spec":{"containers":[{"env":[{"name":"DB_PASSWORD","value":"hunter2"}]}]}}
    prometheus.io/scrape: "true"
  labels:
    app: checkout
  name: checkout-7d9f
  namespace: shop
spec:
  containers:
  - args:
    - --db-url=postgres://admin:s3cret@db:5432/shop
    - --verbose
    command: ["/bin/sh", "-c", "export API_KEY=abc123 && exec app"]
    env:
    - name: DB_PASSWORD
      value: hunter2
    - name: MULTILINE
      value: |
        line-one-secret
        line-two-secret
    - name: FROM_SECRET
      valueFrom:
        secretKeyRef:
          key: password
          name: db-creds
    - name: QUOTED
      value: "quoted-secret"
