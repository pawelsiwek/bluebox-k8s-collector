    command:
      - envoy
      - --config-yaml
      - "admin: {password: p4ss}"
    env: [{name: TOKEN, value: inline-token}]
  volumes:
  - name: creds
    secret:
      secretName: db-creds
  serviceAccountToken: placeholder
  token: abc-raw-token
  Password: Upper-Case-Pass
status:
  phase: Running
