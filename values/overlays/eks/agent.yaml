# EKS overlay, agent release. Layer after values/agent.yaml.
# Node cost labels (C1): capacity type and node pool from the distribution's
# node labels; no IMDS dependency. cloud.resource_id comes from the snippet
# (global.bluebox.cloudResourceId) when the wizard knows it.
global:
  bluebox:
    cloudProvider: aws
config:
  processors:
    k8s_attributes:
      extract:
        labels:
          - {tag_name: host.type, key: node.kubernetes.io/instance-type, from: node}
          - {tag_name: cloud.region, key: topology.kubernetes.io/region, from: node}
          - {tag_name: cloud.availability_zone, key: topology.kubernetes.io/zone, from: node}
          - {tag_name: k8s.node.label.capacity_type, key: eks.amazonaws.com/capacityType, from: node}
          - {tag_name: k8s.node.label.capacity_type, key: karpenter.sh/capacity-type, from: node}
          - {tag_name: k8s.node.label.node_pool, key: eks.amazonaws.com/nodegroup, from: node}
          - {tag_name: k8s.node.label.node_pool, key: karpenter.sh/nodepool, from: node}
# EKS kubelet serving certificates are not signed by the cluster CA, so
# kubelet TLS stays unverified (base default). See README "Kubelet TLS".
