# OCB build of the Bluebox Kubernetes collector.
# Generated from build/dynatrace-manifest-v0.58.1.yaml (Dynatrace/dynatrace-otel-collector
# tag v0.58.1, commit 5920bfa6d0fe288b5a61c632debc474c031b445a) by keeping every component at
# its pinned version and making exactly these changes (manifest_test.go enforces them):
#   - dropped the Dynatrace-internal eecprovider confmap provider (lives in their repo);
#   - added groupbyattrsprocessor (topology namespace-batch fix) at the manifest's contrib version;
#   - added dtk8stopology, dtk8seventsprocessor and alertingengine from this module;
#   - security overrides in `replaces:` for fixable HIGH/CRITICAL findings (README.md § "Security overrides").
# To bump: vendor the new tag's manifest.yaml under build/, apply the same three changes, and
# move the module's go.opentelemetry.io/collector pins to the same release (README § "Bumping").
dist:
  module: github.com/pawelsiwek/bluebox-k8s-collector/collector/distribution
  name: bluebox-otelcol
  description: Bluebox Kubernetes collector (Dynatrace distribution v0.58.1 + Kubernetes topology components)
  output_path: ./_build
  version: 0.1.0

receivers:
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.162.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/filelogreceiver v0.162.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/fluentforwardreceiver v0.162.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/hostmetricsreceiver v0.162.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/jaegerreceiver v0.162.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/journaldreceiver v0.162.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/netflowreceiver v0.162.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/prometheusreceiver v0.162.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/statsdreceiver v0.162.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/syslogreceiver v0.162.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/zipkinreceiver v0.162.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/k8sobjectsreceiver v0.162.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/kubeletstatsreceiver v0.162.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/k8sclusterreceiver v0.162.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/k8seventsreceiver v0.162.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/kafkareceiver v0.162.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/kafkametricsreceiver v0.162.0

exporters:
  - gomod: go.opentelemetry.io/collector/exporter/debugexporter v0.162.0
  - gomod: go.opentelemetry.io/collector/exporter/otlpexporter v0.162.0
  - gomod: go.opentelemetry.io/collector/exporter/otlphttpexporter v0.162.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/loadbalancingexporter v0.162.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/kafkaexporter v0.162.0

extensions:
