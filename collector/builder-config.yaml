  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/groupbyattrsprocessor v0.162.0
  - gomod: github.com/pawelsiwek/bluebox-k8s-collector/collector v0.0.0
    import: github.com/pawelsiwek/bluebox-k8s-collector/collector/processor/dtk8stopology
  - gomod: github.com/pawelsiwek/bluebox-k8s-collector/collector v0.0.0
    import: github.com/pawelsiwek/bluebox-k8s-collector/collector/processor/dtk8seventsprocessor
connectors:
  - gomod: github.com/pawelsiwek/bluebox-k8s-collector/collector v0.0.0
    import: github.com/pawelsiwek/bluebox-k8s-collector/collector/connector/alertingengine
  - gomod: go.opentelemetry.io/collector/connector/forwardconnector v0.162.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/connector/spanmetricsconnector v0.162.0

providers:
  - gomod: go.opentelemetry.io/collector/confmap/provider/envprovider v1.68.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/fileprovider v1.68.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/httpprovider v1.68.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/httpsprovider v1.68.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/yamlprovider v1.68.0

replaces:
  - github.com/pawelsiwek/bluebox-k8s-collector/collector => ../
  # Security overrides (README.md § "Security overrides"); drop each once the pinned
  # Dynatrace manifest's release carries the fix.
  - golang.org/x/net => golang.org/x/net v0.60.0  # CVE-2026-78669, GO-2026-6603/6610/6611/6612/6617 (x/net/http2), fixed in 0.60.0
  - github.com/go-jose/go-jose/v4 => github.com/go-jose/go-jose/v4 v4.1.6  # CVE-2026-116587, fixed in 4.1.6
